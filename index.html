<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="/favicon.ico">
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1224">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Glyphyx">
  <meta name="description" content="Drag glowing rune pebbles onto a 4x4 board, swipe to aim, and watch both sides fire at once. Hold eight tiles to win — 90-second tactical battles.">
  <link rel="manifest" href="/manifest.json">
  <title>Glyphyx</title>
  <style>
      /* The splash paints before any JS runs, so its colours are inlined here
         rather than pulled from the app's stylesheet. They match the arena's
         night-sky background so the handover to the canvas is seamless. */
      body {
          margin: 0;
          background-color: #0a1224;
          outline: none;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: radial-gradient(circle at 50% 38%, #1b2b52 0%, #0a1224 70%);
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      /* The greeting card.
         ------------------------------------------------------------------
         The same picture `FLogoProgress.vue` draws — a rune pebble breathing
         over the title — at the SAME size in the SAME place, so when Vue
         mounts and this element fades out, nothing moves.

         Duplicated rather than shared because this has to paint before any
         stylesheet or module has been fetched. Change one, change both. */
      .splash-greet {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.55rem;
          width: clamp(200px, 58vmin, 340px);
          font-family: 'Angry', Impact, 'Arial Black', sans-serif;
      }

      .splash-pebble {
          width: 46%;
          aspect-ratio: 1;
          animation: splash-breathe 2.6s ease-in-out infinite;
      }

      .splash-pebble svg {
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
          filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
      }

      .splash-glow {
          animation: splash-glow 2.6s ease-in-out infinite;
      }

      .splash-glyph {
          filter: drop-shadow(0 0 6px #ff3b4a) drop-shadow(0 0 1px #fff);
      }

      .splash-logo {
          display: flex;
          justify-content: center;
          width: 100%;
      }

      .splash-wordmark {
          color: #fff;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.14em;
          font-size: clamp(2rem, 12vmin, 3.8rem);
          line-height: 1;
          text-shadow: 0 0 0.35em rgba(120, 200, 255, 0.9), 0 0 0.9em rgba(80, 170, 255, 0.55), 3px 3px 0 #000;
      }

      /* The loading read-out's placeholder. It is here for the SPACE as much as
         the number: without it the card is one line shorter than the one
         FLogoProgress draws, so the whole composition would jump at the
         handover. */
      .splash-progress {
          font-size: clamp(0.9rem, 4vw, 1.35rem);
          font-weight: 900;
          line-height: 1.5;
          color: #fe9a00;
          text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
      }

      @keyframes splash-breathe {
          0%, 100% { transform: translateY(0) scale(1); }
          50%      { transform: translateY(-4%) scale(1.04); }
      }

      @keyframes splash-glow {
          0%, 100% { opacity: 0.55; }
          50%      { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
          .splash-pebble, .splash-glow { animation: none; }
      }
  </style>
</head>
<body>
<div id="static-splash">
  <div class="splash-greet">
    <div class="splash-pebble" aria-hidden="true">
      <svg viewBox="0 0 200 200">
        <defs>
          <radialGradient id="staticStone" cx="0.38" cy="0.32" r="0.75">
            <stop offset="0" stop-color="#6b7590"/>
            <stop offset="0.45" stop-color="#3a4150"/>
            <stop offset="1" stop-color="#151922"/>
          </radialGradient>
          <radialGradient id="staticGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ff5c66" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#ff3b4a" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="100" cy="176" rx="66" ry="12" fill="rgba(0,0,0,0.5)"/>
        <ellipse cx="100" cy="102" rx="80" ry="68" fill="url(#staticStone)" stroke="#0b0d12" stroke-width="4"/>
        <ellipse cx="82" cy="70" rx="34" ry="16" fill="rgba(255,255,255,0.09)"/>
        <circle class="splash-glow" cx="100" cy="104" r="46" fill="url(#staticGlow)"/>
        <path class="splash-glyph" transform="translate(58 58) scale(3.5)" d="M12 1.4 14.5 5.4 13.5 13.6H10.5L9.5 5.4 12 1.4ZM6.6 13.8H17.4A1.5 1.5 0 0 1 17.4 16.8H6.6A1.5 1.5 0 0 1 6.6 13.8ZM10.7 16.9H13.3V20.2H10.7ZM12 19.6A1.7 1.7 0 1 1 12 23 1.7 1.7 0 0 1 12 19.6Z" fill="#ff5c66"/>
      </svg>
    </div>
    <div class="splash-logo">
      <span class="splash-wordmark">Glyphyx</span>
    </div>
    <span class="splash-progress">0%</span>
  </div>
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://bridge.playgama.com/v1/stable/playgama-bridge.js"></script>
<!-- Load the SDK before your game code -->
<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
<!-- Poki SDK - stripped for non-Poki builds by vite.config.ts -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
